<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles/quizz.css">
</head>
<h1>How much do you know about HTML and CSS?</h1>

<body>
    <form>
        <fieldset>

            <legend>CSS Questions</legend>
            <label for="Question1">1.What does the acronym 'CSS' stand for?</label>
            <input type="text" name="q1" id="q1">


            <label for="Question2">2.Explain the difference between a class and an ID selector in
                CSS:</label>
            <textarea name="q2" id="q2" rows="4"></textarea>
        </fieldset>

        <fieldset>
            <legend>HTML Questions</legend>
            <label for="Question3">3.Which HTML element is used to define the most important
                heading?</label>
            <select name="q3" id="q3">
                <option value="" selected disabled>[Choose One ...]</option>
                <option value="1">H1</option>
                <option value="2">heading</option>
                <option value="3">h1</option>
                <option value="4">head_important</option>
            </select>

            <label for="Question4">4.How many heading levels (from h1 to h6) are available in
                HTML?</label>
            <input type="number" name="q4" id="q4" placeholder="Example: 1">
        </fieldset>

        <button type="submit">Submit Answers</button>
    </form>


</body>

</html>
